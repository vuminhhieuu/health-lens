spring:
  application:
    name: healthlens-api

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthlens_dev}
    username: ${DB_USERNAME:healthlens}
    password: ${DB_PASSWORD:healthlens}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

healthlens:
  ocr:
    api-key: ${OCR_API_KEY:dev-placeholder}
  llm:
    api-key: ${LLM_API_KEY:dev-placeholder}
