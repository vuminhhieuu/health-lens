server:
  port: ${PORT:8080}
  address: 0.0.0.0

management:
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: healthlens-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
  cache:
    # Dùng in-memory cache cho môi trường local/test (không cần Redis)
    # Override bằng spring.cache.type=redis trong application-docker.yml
    type: simple
  ai:
    openai:
      # OpenAI-compatible chat provider. Prefer AI_CHAT_*; GROQ_* is legacy migration fallback.
      api-key: ${AI_CHAT_API_KEY:${GROQ_API_KEY:dev-placeholder}}
      base-url: ${AI_CHAT_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai}}
      chat:
        options:
          model: ${AI_CHAT_MODEL:${GROQ_CHAT_MODEL:qwen-2.5-72b-versatile}}
          temperature: 0.7
          max-tokens: 4096
      embedding:
        # Embedding provider tách riêng khỏi chat provider (Groq không hỗ trợ embeddings API).
        base-url: ${EMBEDDING_BASE_URL:https://api.openai.com}
        api-key: ${EMBEDDING_API_KEY:}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:test-api-key}
        use-tls: true
        collection-name: ${QDRANT_COLLECTION:healthlens}
        timeout: 30s
        vector-dimension: ${QDRANT_VECTOR_DIMENSION:1536}
  data:
    redis:
      repositories:
        enabled: false

# App-level config
app:
  ai:
    primary: ${AI_CHAT_PROVIDER:openai-compatible}
    chat:
      provider: ${AI_CHAT_PROVIDER:openai-compatible}
      base-url: ${AI_CHAT_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai}}
      api-key: ${AI_CHAT_API_KEY:${GROQ_API_KEY:dev-placeholder}}
      model: ${AI_CHAT_MODEL:${GROQ_CHAT_MODEL:qwen-2.5-72b-versatile}}
      timeout-ms: ${AI_CHAT_TIMEOUT_MS:30000}
    fallback:
      enabled: true
      explanation: "Kết quả cần được bác sĩ chuyên khoa giải thích thêm."
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2.0
      max-total-delay-ms: 4500
    explanation:
      prompt-version: v3
      retrieval-version: v1
      retrieval:
        top-k: ${APP_AI_EXPLANATION_RETRIEVAL_TOP_K:3}
      ingestion:
        enabled: ${APP_AI_EXPLANATION_INGESTION_ENABLED:false}
        resource: ${APP_AI_EXPLANATION_INGESTION_RESOURCE:classpath:ai/metric-explanations.vi.json}
    online-rag:
      allowlisted-hosts: ${APP_AI_ONLINE_RAG_ALLOWLISTED_HOSTS:}
      connect-timeout-ms: ${APP_AI_ONLINE_RAG_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${APP_AI_ONLINE_RAG_READ_TIMEOUT_MS:5000}
      max-response-bytes: ${APP_AI_ONLINE_RAG_MAX_RESPONSE_BYTES:262144}
      cache-max-age: ${APP_AI_ONLINE_RAG_CACHE_MAX_AGE:PT24H}
  ocr:
    providers:
      primary: ${OCR_PROVIDER_PRIMARY:easyocr}
      fallback-order: ${OCR_PROVIDER_FALLBACK_ORDER:textract}
    confidence:
      # Ngưỡng phân loại confidence OCR (0.0-1.0), có thể override bằng env vars.
      high-threshold: ${OCR_CONFIDENCE_HIGH_THRESHOLD:0.85}
      medium-threshold: ${OCR_CONFIDENCE_MEDIUM_THRESHOLD:0.50}
    service:
      url: ${OCR_SERVICE_URL:http://localhost:8001}
      timeout-ms: ${OCR_TIMEOUT_MS:60000}
      connect-timeout-ms: 10000
    textract:
      enabled: ${OCR_TEXTRACT_ENABLED:false}
      region: ${OCR_TEXTRACT_REGION:${AWS_REGION:ap-southeast-1}}
    gcv:
      enabled: ${OCR_GCV_ENABLED:false}
      project-id: ${OCR_GCV_PROJECT_ID:}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  security:
    blacklist-fail-closed: ${APP_SECURITY_BLACKLIST_FAIL_CLOSED:false}
    rate-limit-fail-closed: ${APP_SECURITY_RATE_LIMIT_FAIL_CLOSED:false}
    rate-limit:
      profile-invitation-accept:
        ip-max: ${APP_RATE_LIMIT_PROFILE_INVITATION_ACCEPT_IP_MAX:20}
        ip-window-seconds: ${APP_RATE_LIMIT_PROFILE_INVITATION_ACCEPT_IP_WINDOW_SECONDS:3600}
        token-max: ${APP_RATE_LIMIT_PROFILE_INVITATION_ACCEPT_TOKEN_MAX:5}
        token-window-seconds: ${APP_RATE_LIMIT_PROFILE_INVITATION_ACCEPT_TOKEN_WINDOW_SECONDS:3600}
      health-record-invitation-accept:
        ip-max: ${APP_RATE_LIMIT_HEALTH_RECORD_INVITATION_ACCEPT_IP_MAX:20}
        ip-window-seconds: ${APP_RATE_LIMIT_HEALTH_RECORD_INVITATION_ACCEPT_IP_WINDOW_SECONDS:3600}
        token-max: ${APP_RATE_LIMIT_HEALTH_RECORD_INVITATION_ACCEPT_TOKEN_MAX:5}
        token-window-seconds: ${APP_RATE_LIMIT_HEALTH_RECORD_INVITATION_ACCEPT_TOKEN_WINDOW_SECONDS:3600}
    # Short TTL: hot-path reads hit Redis; DataDeletionService writes through on every status change.
    account-status-cache-ttl: ${APP_SECURITY_ACCOUNT_STATUS_CACHE_TTL:60s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  sharing:
    # Notify profile owner by email when a pending invitation is accepted (toggle for PAE-12 later).
    notify-owner-on-accept: ${APP_SHARING_NOTIFY_OWNER_ON_ACCEPT:true}
  stream:
    email-events: ${APP_STREAM_EMAIL_EVENTS:email.events}
    email-consumer-group: ${APP_STREAM_EMAIL_CONSUMER_GROUP:email-consumers}
    email-consumer-name: ${APP_STREAM_EMAIL_CONSUMER_NAME:api-email-consumer}
    email-poll-delay-ms: ${APP_STREAM_EMAIL_POLL_DELAY_MS:1000}
    ocr-events: ${APP_STREAM_OCR_EVENTS:ocr.events}
    ocr-consumer-group: ${APP_STREAM_OCR_CONSUMER_GROUP:ocr-consumers}
    ocr-consumer-name: ${APP_STREAM_OCR_CONSUMER_NAME:api-ocr-consumer}
    ocr-poll-delay-ms: ${APP_STREAM_OCR_POLL_DELAY_MS:1000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:healthlens-dev}
    region: ${AWS_REGION:ap-southeast-1}
    bucket-check-on-startup: ${MINIO_BUCKET_CHECK_ON_STARTUP:true}
    bucket-auto-create: ${MINIO_BUCKET_AUTO_CREATE:false}
    cors-configure: ${MINIO_CORS_CONFIGURE:false}
    cors-allowed-origins: ${MINIO_CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:dev-test-secret-key-min-32-chars-for-local}
  access-ttl: 900000     # 15 minutes in ms
  refresh-ttl: 604800000  # 7 days in ms
  admin-access-ttl: 900000  # 15 minutes in ms (admin session)

admin:
  totp:
    encryption-key: ${ADMIN_TOTP_ENCRYPTION_KEY:dev-totp-aes-key-32-chars-long!!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
spring:
  config:
    activate:
      on-profile: dev
  # PostgreSQL required: JSONB audit columns and jsonb_extract_path_text in admin audit filters.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthlens_dev}
    username: ${DB_USERNAME:healthlens}
    password: ${DB_PASSWORD:healthlens}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

app:
  ocr:
    providers:
      primary: ${OCR_PROVIDER_PRIMARY:easyocr}
      fallback-order: ${OCR_PROVIDER_FALLBACK_ORDER:textract}
  mail:
    from: ${MAIL_FROM:no-reply@healthlens.vn}
    driver: ${MAIL_DRIVER:smtp}
  frontend:
    base-url: ${WEB_APP_URL:http://localhost:3000}
    verification-url: ${WEB_VERIFY_URL:http://localhost:3000/verify-email}
    cancellation-url: ${WEB_CANCELLATION_URL:http://localhost:3000/cancel-deletion}
  storage:
    bucket-auto-create: ${MINIO_BUCKET_AUTO_CREATE:true}
    cors-configure: ${MINIO_CORS_CONFIGURE:false}
  cookie:
    secure: false
  security:
    rate-limit:
      profile-invitation-accept:
        ip-max: 500
        ip-window-seconds: 60
        token-max: 200
        token-window-seconds: 60
      health-record-invitation-accept:
        ip-max: 500
        ip-window-seconds: 60
        token-max: 200
        token-window-seconds: 60

jwt:
  secret: ${JWT_SECRET:healthlens-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algo}

healthlens:
  ocr:
    api-key: ${OCR_API_KEY:dev-placeholder}
  llm:
    api-key: ${LLM_API_KEY:dev-placeholder}

---
# Staging Profile - Railway + Neon
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DB_URL:?Database URL is required}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      ssl:
        enabled: ${REDIS_SSL:true}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  ocr:
    providers:
      primary: ${OCR_PROVIDER_PRIMARY:gcv}
      fallback-order: ${OCR_PROVIDER_FALLBACK_ORDER:textract}
  mail:
    from: ${MAIL_FROM:noreply@healthlens.vn}
    driver: ${MAIL_DRIVER:smtp}
  frontend:
    base-url: ${WEB_APP_URL:https://healthlens-staging.vercel.app}
    verification-url: ${WEB_VERIFY_URL:https://healthlens-staging.vercel.app/verify-email}
    reset-password-url: ${WEB_RESET_PASSWORD_URL:https://healthlens-staging.vercel.app/reset-password}
    login-url: ${WEB_LOGIN_URL:https://healthlens-staging.vercel.app/login}
    cancellation-url: ${WEB_CANCELLATION_URL:https://healthlens-staging.vercel.app/cancel-deletion}
  storage:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:healthlens-staging}
    use-ssl: true

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}

healthlens:
  ocr:
    api-key: ${OCR_API_KEY:}
    service-url: ${OCR_SERVICE_URL:}

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DB_URL:?Database URL is required}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      ssl:
        enabled: ${REDIS_SSL:true}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  ocr:
    providers:
      primary: ${OCR_PROVIDER_PRIMARY:gcv}
      fallback-order: ${OCR_PROVIDER_FALLBACK_ORDER:textract}
  mail:
    from: ${MAIL_FROM:noreply@healthlens.vn}
    driver: smtp
  cookie:
    secure: true
  frontend:
    base-url: ${WEB_APP_URL:https://healthlens.vn}
    verification-url: ${WEB_VERIFY_URL:https://healthlens.vn/verify-email}
    reset-password-url: ${WEB_RESET_PASSWORD_URL:https://healthlens.vn/reset-password}
    login-url: ${WEB_LOGIN_URL:https://healthlens.vn/login}
    cancellation-url: ${WEB_CANCELLATION_URL:https://healthlens.vn/cancel-deletion}
  storage:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:healthlens-prod}
    use-ssl: true

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}
