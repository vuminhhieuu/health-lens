spring:
  application:
    name: healthlens-api
  jpa:
    open-in-view: false
  cache:
    # Dùng in-memory cache cho môi trường local/test (không cần Redis)
    # Override bằng spring.cache.type=redis trong application-docker.yml
    type: simple
  ai:
    openai:
      # Groq API (OpenAI-compatible)
      api-key: ${GROQ_API_KEY:dev-placeholder}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_CHAT_MODEL:qwen-2.5-72b-versatile}
          temperature: 0.7
          max-tokens: 500
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:b189ed5b-51e0-4209-8703-12d4728ed745.us-east-2-0.aws.cloud.qdrant.io}
        port: 6334
        api-key: ${QDRANT_API_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6ZGUyZGFlNGQtNWJhOS00NDE2LWJjZTQtYjlmZTI1OTBiYjhmIn0.t0bnQJpoNO1WDcEu5qH2bD0utg-occzXkEqwnb7eCLA}
        use-tls: true
        collection-name: healthlens
        timeout: 30s
        vector-dimension: 1024

# App-level AI config
app:
  ai:
    primary: groq
    fallback:
      enabled: true
      explanation: "Kết quả cần được bác sĩ chuyên khoa giải thích thêm."
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2.0
  ocr:
    service:
      url: ${OCR_SERVICE_URL:http://localhost:8001}
      timeout-ms: ${OCR_TIMEOUT_MS:10000}
      connect-timeout-ms: 5000
    textract:
      enabled: false
      region: ${AWS_REGION:ap-southeast-1}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthlens_dev}
    username: ${DB_USERNAME:healthlens}
    password: ${DB_PASSWORD:healthlens}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  mail:
    from: ${MAIL_FROM:no-reply@healthlens.vn}
  frontend:
    verification-url: ${WEB_VERIFY_URL:http://localhost:3000/verify-email}

healthlens:
  ocr:
    api-key: ${OCR_API_KEY:dev-placeholder}
  llm:
    api-key: ${LLM_API_KEY:dev-placeholder}
