spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/healthlens_dev}
    username: ${DB_USERNAME:healthlens}
    password: ${DB_PASSWORD:healthlens_dev_password}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      # Trong Docker network, Redis host là tên service "redis" (không phải localhost)
      host: ${REDIS_HOST:-redis}
      port: ${REDIS_PORT:-6379}

  cache:
    # Dùng Redis làm cache provider trong Docker
    type: redis
  
  ai:
    openai:
      # OpenAI-compatible chat provider. Prefer AI_CHAT_*; GROQ_* is legacy migration fallback.
      api-key: ${AI_CHAT_API_KEY:${GROQ_API_KEY:dev-placeholder}}
      base-url: ${AI_CHAT_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai}}
      chat:
        options:
          model: ${AI_CHAT_MODEL:${GROQ_CHAT_MODEL:qwen-2.5-72b-versatile}}
          temperature: 0.7
          max-tokens: 500
      embedding:
        # Embedding provider riêng (Groq KHÔNG hỗ trợ embedding API).
        # EMBEDDING_BASE_URL: đổi nếu dùng provider khác OpenAI (ví dụ: https://api.jina.ai/v1)
        # EMBEDDING_API_KEY: phải set riêng, KHÔNG dùng AI_CHAT_API_KEY
        base-url: ${EMBEDDING_BASE_URL:https://api.openai.com}
        api-key: ${EMBEDDING_API_KEY}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      qdrant:
        # QUAN TRỌNG: QDRANT_HOST phải là hostname THUẦN, KHÔNG có https://
        # Đúng:   ep-xxxx.cloud.qdrant.io
        # Sai:    https://ep-xxxx.cloud.qdrant.io  ← gây lỗi "Invalid host or port"
        host: ${QDRANT_HOST}
        port: 6334
        api-key: ${QDRANT_API_KEY}
        use-tls: true

# Actuator for Health Checks
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics
    health:
      show-details: always
