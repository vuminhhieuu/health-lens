<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chia sẻ hồ sơ đã được chấp nhận - HealthLens</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family: Segoe UI, Arial, sans-serif;
      color: #111827;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: 24px auto;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
      "
    >
      <div
        style="
          background: linear-gradient(135deg, #10b981 0%, #059669 100%);
          padding: 28px;
          text-align: center;
        "
      >
        <h1 style="color: #ffffff; margin: 0; font-size: 28px">HealthLens</h1>
      </div>
      <div style="padding: 28px">
        <h2 style="margin-top: 0">Lời mời chia sẻ đã được chấp nhận</h2>
        <p>Xin chào,</p>
        <p>
          <strong th:text="${viewerName}">Thành viên</strong>
          đã chấp nhận lời mời và có thể xem hồ sơ
          <strong th:text="${profileDisplayName}">Hồ sơ sức khỏe</strong>
          trên HealthLens.
        </p>
        <div style="text-align: center; margin: 24px 0">
          <a
            th:href="${profilesLink}"
            href="#"
            style="
              display: inline-block;
              background: #10b981;
              color: #ffffff;
              padding: 12px 28px;
              border-radius: 8px;
              text-decoration: none;
              font-weight: 600;
            "
          >
            Xem hồ sơ gia đình
          </a>
        </div>
        <p style="font-size: 14px; color: #6b7280">
          Bạn có thể thu hồi quyền truy cập bất cứ lúc nào trong phần quản lý chia sẻ hồ sơ.
        </p>
      </div>
      <div
        style="
          background: #f9fafb;
          padding: 18px;
          text-align: center;
          font-size: 13px;
          color: #6b7280;
        "
      >
        <p style="margin: 0">HealthLens - Theo dõi sức khỏe của bạn</p>
      </div>
    </div>
  </body>
</html>
