name: Deploy Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_WEB: ${{ github.repository }}/web
  IMAGE_NAME_OCR: ${{ github.repository }}/ocr-service

jobs:
  # =========================================
  # Build Docker Images
  # =========================================
  build:
    name: Build Images
    runs-on: ubuntu-latest
    outputs:
      api_tag: ${{ steps.meta.outputs.tags_api }}
      web_tag: ${{ steps.meta.outputs.tags_web }}
      is_main: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for OCR
        id: meta_ocr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OCR }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: apps/api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: apps/web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push OCR image
        uses: docker/build-push-action@v5
        with:
          context: services/ocr-service
          dockerfile: Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta_ocr.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================
  # Deploy to Production (Main branch only)
  # =========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            set -e
            
            cd /app/health-lens
            
            # Pull latest code
            git pull origin main
            
            # Pull Docker images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:main-${{ github.sha }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:main-${{ github.sha }}
            
            # Tag images
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:main-${{ github.sha }} healthlens-api:prod
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:main-${{ github.sha }} healthlens-web:prod
            
            # Stop old containers
            docker compose -f docker/compose.yml -f docker/compose.prod.yml down || true
            
            # Start services
            docker compose -f docker/compose.yml -f docker/compose.prod.yml --env-file .env.production up -d
            
            # Wait for healthy
            for i in {1..30}; do
              if curl -sf http://localhost:8080/actuator/health/liveness; then
                echo "API is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 5
            done
            
            # Cleanup
            docker image prune -af --filter "until=24h" || true
            
            echo "Production deployment completed!"
          EOF

      - name: Verify Deployment
        run: |
          echo "Verifying production deployment..."
          sleep 30
          curl -sf https://api.healthlens.com/actuator/health/liveness && echo "API OK" || echo "API check failed"

  # =========================================
  # Notify on Failure
  # =========================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy-production]
    if: failure()
    steps:
      - name: Failure Notification
        run: |
          echo "Deployment failed! Please check the logs."
