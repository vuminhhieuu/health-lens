name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api-test:
    name: api:test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run API tests
        working-directory: apps/api
        run: ./gradlew test

  web-test:
    name: web:test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run web tests
        working-directory: apps/web
        run: pnpm test

  web-build:
    name: web:build
    runs-on: ubuntu-latest
    needs: [web-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build web app
        working-directory: apps/web
        run: pnpm build

  api-build:
    name: api:build
    runs-on: ubuntu-latest
    needs: [api-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build API image
        working-directory: apps/api
        run: ./gradlew bootBuildImage
