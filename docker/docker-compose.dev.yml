# Docker Compose for Local Development (Option B+)
# ==========================================
#
# Option B+ uses cloud services for AI/ML:
#   - Database: Neon PostgreSQL (managed, free tier)
#   - Vector DB: Qdrant Cloud (managed, free tier)
#   - LLM: Groq API (cloud, free tier)
#   - Embeddings: Groq API (cloud, free tier)
#
# Local services (optional):
#   - EasyOCR: Python microservice for OCR (~500MB RAM)
#   - Redis: For caching (skip for MVP)
#   - MinIO: For local file uploads (use AWS S3 in production)
#   - Mailhog: For email testing
#   - API: Spring Boot application
#   - Web: Next.js application

services:
  # =========================================
  # Option B+: No local PostgreSQL needed
  # Use Neon PostgreSQL Cloud instead
  # Database is handled by cloud service
  # =========================================

  # =========================================
  # Optional: Redis (for caching, skip for MVP)
  # =========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Redis chạy mặc định vì LlmService dùng @Cacheable
    # Dùng profile with-redis-external nếu muốn kết nối Redis ngoài

  # =========================================
  # MinIO: Object Storage (local S3-compatible)
  # Used for storing uploaded health documents
  # In production, use AWS S3 instead
  # =========================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # EasyOCR: OCR Microservice (Python FastAPI)
  # Option B+ uses EasyOCR instead of PaddleOCR
  # RAM: ~500MB (vs 3-5GB for PaddleOCR)
  # =========================================
  ocr-service:
    build:
      context: ../services/ocr-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - EASYOCR_MODEL_PATH=/models
    volumes:
      - ocr-models:/root/.EasyOCR
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    profiles:
      - with-ocr

  # =========================================
  # HealthLens API (Spring Boot)
  # Connects to cloud services: Neon DB, Qdrant Cloud, Groq API
  # =========================================
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # OCR Service (optional - use profile with-ocr)
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-}
      # Redis: dùng tên service "redis" trong Docker network
      # Override bằng REDIS_HOST trong .env nếu dùng Redis ngoài
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
    env_file:
      - ../.env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Dùng /liveness thay vì /health để tránh Redis của container bị DOWN làm container unhealthy
      # /liveness: chỉ check app alive (không check external dependencies)
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =========================================
  # HealthLens Web (Next.js)
  # Frontend application
  # =========================================
  web:
    build:
      # Context là root monorepo vì Dockerfile cần truy cập:
      # - pnpm-workspace.yaml (root)
      # - packages/shared/package.json
      # - apps/web/ (toàn bộ web app)
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================
  # Mailhog: Email testing (development only)
  # =========================================
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - with-mail

volumes:
  minio-data:
  ocr-models:

# =========================================
# Option B+ Cloud Services (External)
# =========================================
# These services run in the cloud and don't need Docker:
#
# 1. Neon PostgreSQL (https://neon.tech)
#    - Create project at: https://cloud.neon.tech
#    - Set DB_URL in .env
#
# 2. Qdrant Cloud (https://qdrant.tech)
#    - Create cluster at: https://cloud.qdrant.io
#    - Set QDRANT_HOST and QDRANT_API_KEY in .env
#
# 3. Groq API (https://console.groq.com)
#    - Get API key at: https://console.groq.com/keys
#    - Set GROQ_API_KEY in .env
#
# See .env.example for all required environment variables

# =========================================
# Usage Examples
# =========================================
#
# Start only API and Web (core services only):
#   docker compose -f docker/docker-compose.dev.yml up api web
#
# Start with OCR service:
#   docker compose -f docker/docker-compose.dev.yml --profile with-ocr up
#
# Redis chạy mặc định (cần cho @Cacheable trong LlmService)
# Nếu muốn dùng Redis ngoài: set REDIS_HOST trong .env
#
# Start with MinIO:
#   docker compose -f docker/docker-compose.dev.yml --profile with-minio up
#
# Start with email testing:
#   docker compose -f docker/docker-compose.dev.yml --profile with-mail up
#
# Start everything:
#   docker compose -f docker/docker-compose.dev.yml \
#     --profile with-ocr --profile with-redis --profile with-mail up
#
# Note: Ensure all required environment variables are set in .env:
#   - NEON_DATABASE_URL
#   - NEON_USER
#   - NEON_PASSWORD
#   - GROQ_API_KEY
#   - QDRANT_HOST
#   - QDRANT_API_KEY
